# ABOUTME: MCP server crate exposing sync orchestrator tools via Model Context Protocol
# ABOUTME: Supports stdio and HTTP transports with sync, status, and configuration tools
#
# SPDX-License-Identifier: Apache-2.0
# Copyright (c) 2026 dravr.ai

[package]
name = "dravr-enforme-mcp"
version = "0.1.19"
edition = "2021"
license = "Apache-2.0"
description = "MCP server for dravr-enforme sync orchestrator — expose sync tools via Model Context Protocol"
repository = "https://github.com/dravr-ai/dravr-enforme"
readme = "README.md"
keywords = ["mcp", "health", "sync", "json-rpc", "wearables"]
categories = ["science", "development-tools"]
publish = false

[lib]
name = "dravr_enforme_mcp"
path = "src/lib.rs"

[[bin]]
name = "dravr-enforme-mcp"
path = "src/main.rs"

[dependencies]
dravr-enforme = { path = "../..", version = "0.1.19" }
dravr-tronc = "0.2"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[lints]
workspace = true
