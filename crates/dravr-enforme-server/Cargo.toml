# ABOUTME: Unified REST API + MCP server for dravr-enforme sync orchestrator
# ABOUTME: Exposes sync tools via HTTP endpoints and MCP protocol
#
# SPDX-License-Identifier: Apache-2.0
# Copyright (c) 2026 dravr.ai

[package]
name = "dravr-enforme-server"
version = "0.1.19"
edition = "2021"
license = "Apache-2.0"
description = "Unified REST API + MCP server for dravr-enforme sync orchestrator"
repository = "https://github.com/dravr-ai/dravr-enforme"
readme = "README.md"
keywords = ["health", "sync", "rest", "mcp", "server"]
categories = ["science", "web-programming::http-server"]
publish = false

[lib]
name = "dravr_enforme_server"
path = "src/lib.rs"

[[bin]]
name = "dravr-enforme-server"
path = "src/main.rs"

[dependencies]
dravr-enforme = { path = "../..", version = "0.1.19" }
dravr-enforme-mcp = { path = "../dravr-enforme-mcp", version = "0.1.19" }
dravr-tronc = { version = "0.2", features = ["notifications"] }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "time"] }
tracing = "0.1"

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["full", "test-util"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
