[workspace]
members = [".", "crates/dravr-enforme-mcp", "crates/dravr-enforme-server"]

[package]
name = "dravr-enforme"
version = "0.1.21"
edition = "2021"
license = "Apache-2.0"
description = "Health data sync orchestrator — webhook-driven provider sync with cursor-based CDC for the Dravr platform"
repository = "https://github.com/dravr-ai/dravr-enforme"
homepage = "https://github.com/dravr-ai/dravr-enforme"
readme = "README.md"
keywords = ["health", "sync", "webhooks", "wearables", "cdc"]
categories = ["science", "asynchronous"]

# ============================================================================
# Build Profiles
# ============================================================================

[profile.release]
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true

# ============================================================================
# Workspace Lint Configuration
# ============================================================================
# Shared across all workspace crates via [lints] workspace = true.
# Individual crates inherit these settings automatically.
#
# ZERO TOLERANCE ENFORCEMENT:
#   cargo clippy (reads this config, applies level = "deny")

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Base configuration: Enable clippy lint groups at DENY level
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

# Type conversion casts - allowed when properly validated
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"

# Const fn suggestions - clippy suggests const for methods that can't be const
missing_const_for_fn = "allow"

# Significant drop tightening - false positives with async lock guards
significant_drop_tightening = "allow"

# Module naming - allow repetition for clarity
module_name_repetitions = "allow"

# Enforce `use` imports over inline qualified paths (crate::foo::bar)
# Idiomatic Rust prefers imports at top of file for readability
absolute_paths = "deny"

# Multiple dependency versions - unavoidable in some transitive deps
multiple_crate_versions = "allow"

# Missing errors doc - not all error returns need doc comments
missing_errors_doc = "allow"

# must_use candidate - too noisy for builders and constructors
must_use_candidate = "allow"

# return_self_not_must_use - builder pattern methods
return_self_not_must_use = "allow"

# redundant_pub_crate - explicit visibility is clearer
redundant_pub_crate = "allow"

# unnecessary_literal_bound - false positives with async trait lifetimes
unnecessary_literal_bound = "allow"

[lib]
name = "dravr_enforme"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dravr-equilibre = { git = "https://github.com/dravr-ai/dravr-equilibre.git", tag = "v0.2.3" }
dravr-riviere = { git = "https://github.com/dravr-ai/dravr-riviere.git", tag = "v0.2.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt"] }
tracing = "0.1"
http = "1"

# Optional: provider implementations
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false, optional = true }
ring = { version = "0.17", optional = true }
hex = { version = "0.4", optional = true }

# Optional: webhook handling needs axum types
axum = { version = "0.8", default-features = false, optional = true }

# Optional: sciotte browser scraping for Garmin/Strava (private repo)
dravr-sciotte = { git = "https://github.com/dravr-ai/dravr-sciotte.git", tag = "v0.6.0", optional = true }

[features]
default = []
webhooks = ["dep:axum", "dep:hex"]
provider-whoop = ["dep:reqwest", "dep:ring", "webhooks"]
provider-garmin = ["dep:dravr-sciotte"]
provider-strava = ["dep:dravr-sciotte"]
all-providers = ["provider-whoop", "provider-garmin", "provider-strava"]

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
serde_json = "1"
hex = "0.4"

[lints]
workspace = true
